name: Pipeline [test -> build -> deploy]

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable or testing tags
        required: false
        default: ''
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  helm_lint:
    strategy:
      matrix:
        environments: ['dev', 'test', 'preprod', 'prod']
    name: helm lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}
  app_version:
    name: Create app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}
    steps:
      - id: app_version
        name: Application version creators
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/create_app_version@cd6fbead3223fc36e047987f45af2ffacfd41c70 # v1.1.6
  gradle_verify:
    name: Validate the kotlin
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    needs:
      - app_version
    with:
      gradle-command: 'BUILD_NUMBER=${{ needs.app_version.outputs.version }} ./gradlew assemble check'
      # Upload the jar whenever the docker image will be built
      upload-build-artifacts: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      java-version: "21"
  build:
    name: Build docker image from hmpps-github-actions
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2 # WORKFLOW_VERSION
    needs:
      - app_version
      - gradle_verify
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      # Respect manual push flag while keeping pushes on CI builds
      push: ${{ github.event_name == 'workflow_dispatch' && inputs.push || github.event_name != 'workflow_dispatch' }}
      docker_multiplatform: false
      # Must match the BUILD_NUMBER used to build the jar
      image_version: ${{ needs.app_version.outputs.version }}
      download_build_artifacts: true
  deploy_dev:
    name: Deploy to the development environment
    needs:
      - build
      - helm_lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'dev'
      app_version: '${{ needs.build.outputs.app_version }}'
  deploy_preprod:
    name: Deploy to pre-production environment
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - deploy_dev
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'preprod'
      app_version: '${{ needs.build.outputs.app_version }}'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # This will cancel all running build/test/release pipelines that are not on the main branch
      # If this pipeline is on the main branch, it will wait until existing runs complete
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  deploy_prod:
    name: Deploy to production environment
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - deploy_preprod
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'prod'
      app_version: '${{ needs.build.outputs.app_version }}'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # This will cancel all running build/test/release pipelines that are not on the main branch
      # If this pipeline is on the main branch, it will wait until existing runs complete
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
